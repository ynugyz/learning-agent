interface:
  display_name: "Learning Knowledge Growth"
  short_description: "Turn learning materials into linked notes with clear hierarchy and source-grounded diagrams"
  default_prompt: "Use $learning-knowledge-growth to classify the supplied materials and compile source-grounded, linked Human and AI notes. Tier concepts by source signals: explain core concepts with their mechanism, reasoning chain, conditions and formulas; keep secondary terms and representative examples brief or in folded callouts; collect name-only and uncertain items at the page end. Give each knowledge object one home page and link to it from other pages instead of restating it; place wikilinks inside the sentences where relations are stated. Audit each source for processes, structures, comparisons, hierarchies, variable relationships, coordinate planes, function curves, geometric constructions, vectors, probability trees, and matrix layouts; choose by the learning question: Excalidraw for shapes, curve shifts, coordinates and side-by-side panels (including schematics reconstructed from a teacher's spoken description of a missing figure), Mermaid only for non-spatial flows, tables for attribute comparisons; before drawing, read references/visuals-and-excalidraw.md; build coordinate, curve, multi-panel figures and review maps with the bundled scripts (excalidraw_figure.py, excalidraw_review_map.py), use Obsidian's native CLI only for small labelled schematics or edits, then render a preview, look at it, and pass the layout lint and scene validator before delivery. When the user has authorized web lookup and the teacher dwells on a real-world case whose data was not supplied, add a clearly labelled external supplement from traceable public sources and redraw charts from public data. Turn every core formula-driven mechanism into an interactive model from assets/interactive-model-template.html with lesson-matched presets and labelled assumptions, and list each core mechanism with its model or the reason none was built, and keep one Excalidraw review map per chapter drawn from existing card relations, with boxes linked to home sections and the user's own edits preserved. Never invent coordinates, curve values, geometry, labels, or equations. Reuse unchanged knowledge only after its source and dependency state is confirmed; return to original evidence for important claims."
